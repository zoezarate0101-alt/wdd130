<!doctype html>
<html>
<link rel="stylesheet" href="styles/poll-forms.css">

<header>
    <main>
        <form>
            <label for="Username">Full Name</label>
            <input type="text" id="fullname" required>

            <label for="Email Address">Email Address</label>
            <input type="email" id="useremail" required>

            <label for="quantity">Select Quantity</label>
            <select name="quantity" id="quantity">
                <option value="1">One</option>
                <option value="2">Two</option>
                <option valu="3">Three</option>
            </select>

            <label for="Browser">What is your favorite browser?</label>
            <select name="Browser" id="Browser">
                <option value="1">Chrome</option>
                <option value="2">Safari</option>
                <option value="3">Edge</option>
                <option value="4">Brave</option>
                <option value="5">Other</option>
            </select>

            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">

            <label for="feedback">List the plavces you have lived:</label>
            <textarea id="feedback" name="feedback" rows="4"
              placeholder="Stillwater Florida, Amsterdam Nethrland"></textarea>
            <button type="Submit Poll">Submit poll</button>
        </form>
    </main>
</header>

<footer>

</footer>

</html>
