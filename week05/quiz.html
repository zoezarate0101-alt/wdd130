<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>HTML Form Quiz</h1>
    <form>

        <label for="q1">What does a semantic tag mean?</label>
        <input type="text" id="q1" name="q1">

        <label for="q2">Which is the element that separates the padding and the
            margin?</label>
        <textarea id="q2" name="q2" rows="2"></textarea>


        <label for="q3">Which of the following elements belong to Grid?</label>
        <select name="elements" id="elements">
            <option value="" selected disabled>Choose one...</option>
            <option value="1">Relative</option>
            <option value="2">Gap</option>
            <option value="3">Range</option>
        </select>

        <label for="q4">According to the 'Index' element, from which number does the counting of
            letters by their position
            start?</label>
        <input type="number" name="q4" id="q4">

        <button type="Submit">Submit Quiz</button>
    </form>
</body>

</html>
